name: Cross-platform runtime
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  pipeline:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Install PDF text tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install PDF text tools (macOS)
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install PDF text tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler -y --no-progress
          $pdfTool = Get-ChildItem C:\ProgramData\chocolatey\lib\poppler -Recurse -Filter pdftotext.exe | Select-Object -First 1
          $pdfTool.DirectoryName >> $env:GITHUB_PATH
      - name: Pipeline, recovery, identity and local I/O regressions
        run: >-
          python -m pytest -q
          literature-to-zotero/tests/test_windows_pipeline.py
          literature-to-zotero/tests/test_http_client.py
          literature-to-zotero/tests/test_http_acquisition.py
          literature-to-zotero/tests/test_mineru_resume.py
          literature-to-zotero/tests/test_zotero_ingest.py
          literature-to-zotero/tests/test_full_chain.py
          literature-to-zotero/tests/test_process_run.py
          literature-to-zotero/tests/test_workflow_resume.py
          literature-to-zotero/tests/test_managed_installation.py
          literature-to-zotero/tests/test_setup_connection.py
          literature-to-zotero/tests/test_setup_input.py
          literature-to-zotero/tests/test_onboarding.py
      - name: Windows graphical wizard controls
        if: runner.os == 'Windows'
        run: python -m pytest -q literature-to-zotero/tests/test_setup_gui.py
